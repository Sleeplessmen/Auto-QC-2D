name: Quality

on:
  push:
    branches: ["main", "depl"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Compile active modules
        run: python -m compileall -q apps packages web_qc tests/unit
      - name: Run unit tests
        run: python -m pytest -q
