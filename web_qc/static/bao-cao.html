<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lỗi cần sửa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=10">
<style>
  .rp { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
  .rp-top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .rp-top .logo { color: var(--ink); }
  .rp-top .logo-mark { border-color: var(--accent); }
  .rp-top .logo-mark::before, .rp-top .logo-mark::after { background: var(--accent); box-shadow: 15px 0 0 var(--accent); }
  .rp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .rp-head h1 { font-size: 22px; letter-spacing: -.015em; }
  .rp-guide { margin-top: 14px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r); padding: 12px 14px; font-size: 13.5px; color: var(--ink); }
  .rp-guide ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 2px; }
  .frame { margin-top: 16px; padding: 0; overflow: hidden; }
  .frame-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .frame-head h2 { font-size: 15px; }
  .frame-head .nm { font: 12px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .frame-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .frame-img { background: var(--viewer); display: grid; place-items: center; padding: 8px; }
  .frame-img .stage img { max-height: 520px; cursor: zoom-in; }
  .num-badge { font: 700 13px var(--sans); }
  .issues { list-style: none; margin: 0; padding: 0; }
  .issues li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }
  .issues li:last-child { border-bottom: 0; }
  .issues li.s1 { border-left-color: var(--bad); } .issues li.s0 { border-left-color: var(--warn-mark); } .issues li.note { border-left-color: var(--note); }
  .issues .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--bad); }
  .issues li.s0 .n { background: var(--warn-mark); color: #111; } .issues li.note .n { background: var(--note); }
  .issues .k { font-weight: 600; font-size: 13px; }
  .issues .m { font-size: 13.5px; color: var(--ink); margin-top: 2px; }
  .issues .b { font: 11.5px var(--mono); color: var(--faint); margin-top: 3px; }
  .ov-n { fill: rgba(211, 59, 47, .10); stroke: #ff3b2f; stroke-width: 3; vector-effect: non-scaling-stroke; }
  .ov-n.s0 { fill: rgba(240, 160, 32, .12); stroke: #f0a020; }
  .ov-n.note { fill: rgba(139, 92, 246, .14); stroke: #a07cff; }
  .ov-t { font: 700 26px var(--sans); fill: #fff; paint-order: stroke; stroke: #111; stroke-width: 6px; }
  .rp-empty { text-align: center; padding: 48px 16px; color: var(--muted); }
  @media (max-width: 820px) { .frame-body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="rp">
  <div class="rp-top"><div class="logo"><span class="logo-mark" aria-hidden="true"></span><span>QC nhãn 2D</span></div><span class="meta">· Báo cáo lỗi cho labeler</span></div>
  <div id="root"><div class="panel rp-empty">Đang tải…</div></div>
</div>
<div id="modal" class="modal zoom hidden"><img id="modalImg" alt="Ảnh phóng to"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const q = new URLSearchParams(location.search), RUN = q.get("run"), T = q.get("t");
const pct = p => p == null ? "—" : (p * 100).toFixed(1) + "%";

fetch(`/api/public/runs/${RUN}?t=${encodeURIComponent(T || "")}`).then(async r => {
  const d = await r.json();
  if (!r.ok) throw new Error(d.detail || "Không mở được báo cáo.");
  render(d);
}).catch(err => { $("#root").innerHTML = `<div class="panel rp-empty">${esc(err.message)}</div>`; });

function render(d) {
  document.title = d.job_id ? `Lỗi cần sửa · Job ${d.job_id}` : `Lỗi cần sửa · Lần review #${d.id}`;
  const pass = d.pct != null && d.pct >= d.threshold, nSure = d.items.filter(i => i.sure && i.kind_vi !== "Ghi chú người review").length;
  const groups = [];
  for (const it of d.items) {
    let g = groups.find(x => x.name === it.name);
    if (!g) groups.push(g = { name: it.name, frame: it.frame, preview: null, items: [] });
    g.preview = g.preview || it.preview; if (g.frame == null) g.frame = it.frame;
    g.items.push(it);
  }
  const c = d.compare;
  $("#root").innerHTML = `
    <div class="panel">
      <div class="rp-head">
        <div>
          <h1>${d.job_id ? "Job " + esc(d.job_id) : "Lần review #" + esc(d.id)}${d.task_name ? " · " + esc(d.task_name) : ""}</h1>
          <p class="meta">${d.assignee ? "Labeler " + esc(d.assignee) + " · " : ""}review lúc ${new Date(d.created * 1000).toLocaleString("vi-VN")}${d.guideline_name ? " · Guideline " + esc(d.guideline_name) : ""}</p>
          ${c ? `<div class="compare"><span class="c">So với lần trước</span><span class="c good">Đã sửa ${c.fixed}</span><span class="c ${c.still ? "bad" : ""}">Còn ${c.still}</span><span class="c ${c.new ? "bad" : ""}">Mới ${c.new}</span></div>` : ""}
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="pill ${pass ? "pass" : "fail"}">${pct(d.pct)} box đúng · ${pass ? "Đạt" : "Chưa đạt"}</span>
          ${d.cvat_job_url ? `<a class="btn primary" href="${esc(d.cvat_job_url)}" target="_blank" rel="noopener">Mở job trên CVAT</a>` : ""}
        </div>
      </div>
      <div class="rp-guide"><b>Cách sửa:</b> có ${d.items.length} chỗ cần xem (${nSure} lỗi chắc chắn), xếp theo frame.
        <ol><li>Bấm <b>Mở frame trên CVAT</b> ở từng frame bên dưới.</li><li>Trên CVAT, mỗi chỗ có một Issue ghim đúng vị trí với cùng lời nhắn. Sửa nhãn theo lời nhắn.</li><li>Sửa xong bấm <b>Resolve</b> Issue. Nếu thấy tool nói sai, trả lời ngay dưới Issue để người review xem lại.</li></ol>
      </div>
    </div>
    ${groups.map(g => frameCard(g, d)).join("") || `<div class="panel rp-empty">Không còn lỗi nào cần sửa. 🎉</div>`}`;
  document.querySelectorAll(".stage img").forEach(img => { if (img.complete) overlay(img); else img.onload = () => overlay(img); });
}
function frameCard(g, d) {
  const link = d.cvat_job_url && g.frame != null ? `${d.cvat_job_url}?frame=${g.frame}` : null;
  const cls = it => it.kind_vi === "Ghi chú người review" ? "note" : "s" + (+it.sure);
  return `<section class="panel frame">
    <div class="frame-head"><h2>${g.frame != null ? "Frame " + g.frame : "Ảnh"}</h2><span class="nm" title="${esc(g.name)}">${esc(g.name)}</span>
      ${link ? `<a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">Mở frame trên CVAT</a>` : ""}</div>
    <div class="frame-body">
      <div class="frame-img">${g.preview ? `<div class="stage"><img src="/api/public/runs/${RUN}/preview/${encodeURIComponent(g.preview)}?t=${encodeURIComponent(T)}" alt="Frame ${g.frame ?? ""}" data-boxes='${esc(JSON.stringify(g.items.map((it, i) => [it.box, cls(it), i + 1])))}'><svg aria-hidden="true"></svg></div>` : '<span class="meta">Không có ảnh</span>'}</div>
      <ol class="issues">${g.items.map((it, i) => `<li class="${cls(it)}"><span class="n">${i + 1}</span><div>
        <div class="k">${esc(it.kind_vi)}${it.label ? " · " + esc(it.label) : ""}${it.sure ? "" : ' <span class="meta">(không chắc, kiểm tra lại)</span>'}</div>
        <div class="m">${esc(it.msg)}</div><div class="b">box [${it.box.join(", ")}]</div></div></li>`).join("")}</ol>
    </div></section>`;
}
function overlay(img) {
  const svg = img.nextElementSibling, W = img.naturalWidth, H = img.naturalHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  svg.innerHTML = JSON.parse(img.dataset.boxes).map(([b, c, n]) =>
    `<rect class="ov-n ${c}" x="${b[0]}" y="${b[1]}" width="${Math.max(1, b[2] - b[0])}" height="${Math.max(1, b[3] - b[1])}" rx="2"/><text class="ov-t" x="${b[0] + 4}" y="${Math.max(28, b[1] - 6)}">${n}</text>`).join("");
}
document.addEventListener("click", e => {
  if (e.target.matches(".stage img")) { $("#modalImg").src = e.target.src; $("#modal").classList.remove("hidden"); }
  else if (e.target.closest("#modal")) $("#modal").classList.add("hidden");
});
</script>
</body>
</html>
