services:
  qc:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      QC_DATA_DIR: /var/lib/auto-qc-2d/data
      QC_REVIEW_OUTPUT_DIR: /var/lib/auto-qc-2d/review
      QC_ARTIFACT_DIR: /var/lib/auto-qc-2d/artifacts
      QC_MODEL_CACHE_DIR: /var/lib/auto-qc-2d/models
    ports:
      - "8000:8000"
    volumes:
      - qc_data:/var/lib/auto-qc-2d/data
      - qc_review:/var/lib/auto-qc-2d/review
      - qc_artifacts:/var/lib/auto-qc-2d/artifacts
      - qc_models:/var/lib/auto-qc-2d/models
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  qc_data:
  qc_review:
  qc_artifacts:
  qc_models:
